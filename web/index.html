<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lead Agent MVP</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Lead Agent</h1>
        <p id="statusLine">Loading agent state...</p>
      </div>
      <div class="actions">
        <button id="runBtn">Run Scoring</button>
        <button id="pauseBtn">Pause</button>
        <select id="modeSelect" aria-label="Agent mode">
          <option value="approval">Approval mode</option>
        </select>
      </div>
    </header>

    <main>
      <section class="metrics" aria-label="Pipeline metrics">
        <div><span id="hotCount">0</span><label>Hot</label></div>
        <div><span id="approvalCount">0</span><label>Approvals</label></div>
        <div><span id="followUpCount">0</span><label>Follow-ups</label></div>
        <div><span id="contactedCount">0</span><label>Contacted</label></div>
      </section>

      <section class="grid">
        <div class="panel">
          <div class="panelHead">
            <h2>Approval Queues</h2>
          </div>
          <div class="queueBlock">
            <h3>Ready for Outreach</h3>
            <div id="callApprovals" class="stack"></div>
          </div>
          <div class="queueBlock">
            <h3>Needs Contact Research</h3>
            <div id="researchApprovals" class="stack"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panelHead">
            <h2>Lead Queue</h2>
          </div>
          <div class="tableWrap">
            <table>
              <thead>
                <tr>
                  <th>Lead</th>
                  <th>Priority</th>
                  <th>Score</th>
                  <th>Status</th>
                  <th>Attempts</th>
                </tr>
              </thead>
              <tbody id="leadRows"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panelHead">
          <h2>Agent Activity</h2>
        </div>
        <div id="events" class="timeline"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
