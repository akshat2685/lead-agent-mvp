version: '3.8'

services:
  app:
    build: .
    ports:
      - "8765:8765"
    environment:
      - DATABASE_URL=postgresql://sales_agent:password@db:5432/lead_agent
      - REDIS_URL=redis://cache:6379/0
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db
      - cache

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=sales_agent
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=lead_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
